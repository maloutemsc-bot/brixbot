<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BrixBot — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d1c; --card: #1a1a2e; --border: #26264a; --text: #e9e9f4;
      --muted: #8d8daa; --primary: #e94560; --primary-hover: #ff5c78;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(900px 400px at 100% -10%, rgba(233, 69, 96, 0.10), transparent 60%),
        radial-gradient(800px 400px at -10% 110%, rgba(15, 52, 96, 0.30), transparent 60%),
        var(--bg);
      color: var(--text);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(160deg, var(--card), #121226);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 30px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .logo {
      width: 56px; height: 56px;
      border-radius: 14px;
      display: grid; place-items: center;
      font-size: 26px;
      background: linear-gradient(135deg, var(--primary), #0f3460);
      margin: 0 auto 18px;
      box-shadow: 0 6px 20px rgba(233, 69, 96, 0.35);
    }
    h1 { font-size: 20px; font-weight: 800; text-align: center; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: var(--muted); text-align: center; margin-bottom: 26px; }
    label { font-size: 13px; font-weight: 600; display: block; margin-bottom: 8px; }
    input {
      width: 100%;
      background: #121226;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.15); }
    button {
      width: 100%;
      background: linear-gradient(90deg, var(--primary), #d13a55);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      padding: 13px;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 4px 16px rgba(233, 69, 96, 0.3);
    }
    button:hover { background: linear-gradient(90deg, var(--primary-hover), var(--primary)); transform: translateY(-1px); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .error {
      display: none;
      margin-top: 14px;
      padding: 10px 13px;
      border-radius: 9px;
      font-size: 13px;
      color: #ff8d80;
      background: rgba(231, 76, 60, 0.12);
      border: 1px solid rgba(231, 76, 60, 0.35);
    }
    .error.show { display: block; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">🤖</div>
    <h1>BrixBot</h1>
    <p class="sub">Panneau d'administration — authentification requise</p>
    <form id="loginForm">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" autofocus required>
      <button type="submit" id="loginBtn">Se connecter</button>
    </form>
    <div class="error" id="loginError"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errorBox = document.getElementById('loginError');
      btn.disabled = true;
      btn.textContent = 'Connexion…';
      errorBox.classList.remove('show');
      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: document.getElementById('password').value }),
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Échec de la connexion');
        window.location.href = '/admin';
      } catch (err) {
        errorBox.textContent = err.message || 'Échec de la connexion';
        errorBox.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
